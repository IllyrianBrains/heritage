docs_dir: !ENV [BUILD_DOCS_DIR, "docs"]
site_dir: !ENV [BUILD_SITE_DIR, "site"]
site_url: !ENV [BUILD_SITE_URL, "https://pomodoren.github.io/heritage/docs/"]
site_name: Trashëgimia Natyrore
site_description: Njohuri, mjete dhe procese për mbrojtjen e natyrës dhe të trashëgimisë natyrore në Shqipëri, Kosovë dhe rajon.
repo_url: !ENV [BUILD_REPO_URL, "https://github.com/pomodoren/heritage"]
repo_name: Kontribuo në GitHub
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: DM Sans
  language: sq
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - toc.follow
    - content.action.edit
    - content.code.copy
extra_css:
  - https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap
  - assets/styles/extra.css
extra_javascript:
  - assets/javascripts/wiki-sliders-api.js
plugins:
  - search
  - mkdocs-jupyter
  - i18n:
      default_language: sq
      languages:
        sq:
          name: Shqip
          build: true
  - blog
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - tables
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pomodoren/heritage
nav:
  - Ballina: index.md
  - Baza e njohurive:
      - baza/index.md
      - Themelet:
          - Çfarë është trashëgimia natyrore: baza/cfare-eshte.md
          - Zonat e mbrojtura: baza/zona-te-mbrojtura.md
          - Biodiversiteti: baza/biodiversiteti.md
          - Ujërat & ekosistemet: baza/ujerat.md
          - Peizazhet: baza/peizazhet.md
          - Kërcënimet kryesore: baza/kercenime.md
      - Menaxhimi:
          - baza/menaxhimi/index.md
          - Menaxhimi i zonave: baza/menaxhimi/zonat.md
          - Menaxhimi i specieve: baza/menaxhimi/speciet.md
      - Kuadri i mbrojtjes:
          - Konventat & standardet: baza/konventat.md
          - Ligjet & institucionet: baza/ligje-institucione.md
          - Të drejtat e publikut: baza/te-drejtat.md
      - Të dhënat:
          - Burimet e të dhënave: baza/burime-te-dhena.md
          - Fjalori: baza/fjalori.md
  - Raportimi:
      - raportimi/index.md
      - Kuadrot e raportimit: raportimi/kuadrot.md
      - Të dhënat e nevojshme: raportimi/te-dhenat.md
      - Treguesit: raportimi/treguesit.md
      - Indekset: raportimi/indekset.md
      - Rekomandime:
          - rekomandime/index.md
          - Vëzhgim & identifikim: rekomandime/vezhgim.md
          - Hartëzim & terren: rekomandime/hartezim.md
          - Satelitë & monitorim: rekomandime/monitorim.md
          - Të dhëna & regjistra: rekomandime/te-dhena.md
          - Verifikim & arkivim: rekomandime/verifikim.md
          - Siguria dixhitale: rekomandime/siguria.md
          - Organizata & rrjete: rekomandime/organizata.md
  - Aktivizmi:
      - aktivizmi/index.md
      - Dokumento një problem: aktivizmi/dokumento.md
      - Raporto te institucionet: aktivizmi/raporto.md
      - Kërko informacion publik: aktivizmi/informim.md
      - Pjesëmarrja në vendimmarrje: aktivizmi/pjesemarrje.md
      - Organizo një fushatë: aktivizmi/fushata.md
      - Komuniko me publikun: aktivizmi/komuniko.md
      - Siguria e aktivistëve: aktivizmi/siguria.md
      - Flamingo:
          - Protestat: aktivizmi/protestat/index.md
          - Organizo një protestë: aktivizmi/protestat/organizimi.md
          - Dokumento protestën: aktivizmi/protestat/dokumentimi.md
          - Protesta dhe diaspora: aktivizmi/protestat/diaspora.md
          - Rasti Flamingo: aktivizmi/protestat/flamingo.md
      - Projekte:
          - Vjosa: aktivizmi/raste/vjosa.md
  - Rreth nesh:
      - rreth/index.md
      - Rrjeti: rreth/rrjeti.md
      - Metodologjia: rreth/metodologjia.md
      - Licenca & atribuimi: rreth/licenca.md
      - Si të kontribuosh: rreth/kontribuo.md
